# gitleaks-Konfiguration für MdExplorer.
# Dokumentation: https://github.com/gitleaks/gitleaks/blob/master/README.md#configuration
#
# Die eingebauten Regeln von gitleaks gelten weiter; dazu kommt eine Regel für
# DPAPI-Blobs, und Build-Ausgaben sowie Binärdateien bleiben ungeprüft.

[extend]
useDefault = true

# Ein DPAPI-Blob ist eine lange Base64-Folge. Gemeldet wird sie ab 200 Zeichen hinter
# einem Bezeichner wie "dpapi_blob" oder "cipher_bytes".
[[rules]]
id = "dpapi-blob"
description = "Hardcodiertes DPAPI-Cipher-Blob (Base64 mit langem Präfix-Tag)"
regex = '''(?i)(dpapi[_\-\s]?blob|cipher[_\-\s]?bytes)['"\s:=]+([A-Za-z0-9+/=]{200,})'''
secretGroup = 2
tags = ["secret", "dpapi"]

# Globale Ausnahmen: Pfade und Dateien, die gitleaks überspringt.
[allowlist]
description = "Pfade und Dateien, die nicht gescannt werden"
paths = [
    # Build-Output und IDE-Caches
    '''(?i)(^|/)bin/''',
    '''(?i)(^|/)obj/''',
    '''(?i)(^|/)\.vs/''',
    '''(?i)(^|/)node_modules/''',

    # NuGet-Caches und Lockfiles haben keine Secrets
    '''(?i)(^|/)packages/''',
    '''(?i).*\.lock\.json$''',

    # Embedded Test-Daten und Asset-Binaries
    '''(?i).*\.png$''',
    '''(?i).*\.jpg$''',
    '''(?i).*\.ico$''',
    '''(?i).*\.pdb$''',
    '''(?i).*\.dll$''',

    # Das gitleaks-Programm selbst, falls es lokal unter tools/ liegt
    '''(?i)(^|/)tools/gitleaks''',
    '''(?i)(^|/)tools/LICENSE$''',
]

# Stopwords für die generischen Default-Regeln, um Test-Daten und kommentierte
# Beispiele aus Fakes/Stubs herauszufiltern. „test“ steht bewusst nicht darin: Es verschluckte
# jeden echten Schlüssel, der es im Namen trägt, etwa einen Testschlüssel eines Zahlungsdienstes.
stopwords = [
    "fake",
    "stub",
    "placeholder",
    "example",
    "sample",
    "dummy",
]

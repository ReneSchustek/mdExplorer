name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wöchentlicher Security-Scan, damit neue CVEs in unveränderten Abhängigkeiten
    # auch ohne Push gefunden werden. Sonntag 04:00 UTC = außerhalb der Arbeitszeit.
    - cron: '0 4 * * 0'

# Ab Werk nur Lesen; ein Job, der mehr braucht, sagt es selbst. Fremde Actions laufen über
# ihren Commit statt über einen beweglichen Tag, die Fassung steht dahinter.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.x'

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - name: Solution bauen, damit CodeQL die übersetzten Assemblies analysieren kann
        run: |
          dotnet restore MdExplorer.slnx
          dotnet build MdExplorer.slnx --no-restore

      - name: CodeQL-Analyse durchführen
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:csharp'

  dependency-review:
    name: Dependency Review (SCA)
    runs-on: ubuntu-latest
    # Die Aktion vergleicht zwei Stände miteinander. Beim Pull Request kennt sie beide
    # selbst, beim Push nicht. Dort werden sie unten ausdrücklich übergeben. Ein neu
    # angelegter Branch trägt als Vorgänger die Null-SHA und hat nichts zu vergleichen.
    # Bei Zeitplan und Handauslösung bleibt der Job übersprungen: eine Diff-Prüfung ohne
    # Diff gibt es nicht. Dort prüfen der Job „NuGet Vulnerability Audit" über den
    # vollständigen Paketstand und die Dependabot-Alerts, die neue Advisories auch ohne
    # Lauf melden. Für private Repositories verlangt die Aktion Advanced Security und
    # bricht sonst ab. Die Sichtbarkeitsbedingung sichert gegen einen späteren Wechsel.
    if: >-
      github.event.repository.visibility == 'public'
      && (github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'))
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Abhängigkeiten eines Pull Requests prüfen
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

      - name: Abhängigkeiten des veröffentlichten Standes prüfen
        if: github.event_name == 'push'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          base-ref: ${{ github.event.before }}
          head-ref: ${{ github.sha }}

  vulnerable-packages:
    name: NuGet Vulnerability Audit (SCA)
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore MdExplorer.slnx

      - name: Vulnerable-Packages-Check (transitives Schließen, hartes Gate)
        shell: pwsh
        run: |
          $output = dotnet list MdExplorer.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($output -match 'has the following vulnerable packages') {
            Write-Host '::error::Vulnerable NuGet-Pakete gefunden — Build hart abgebrochen.'
            exit 1
          }

      - name: Deprecated-Packages-Check (Warnung, kein Fail)
        shell: pwsh
        continue-on-error: true
        run: dotnet list MdExplorer.slnx package --deprecated --include-transitive

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Bewusst der direkte Aufruf statt der Action: Die Action leitet den zu prüfenden
      # Bereich aus dem Push-Ereignis ab und bildet dabei `<erster-commit>^`. Für den
      # Wurzel-Commit gibt es keinen Vorgänger, dann bricht git ab und der Scan läuft
      # überhaupt nicht, meldet aber „kein Fund". Ein Scan, der still nichts prüft, ist
      # schlechter als keiner. `detect` ohne Bereichsangabe prüft immer die vollständige
      # Historie und ist von der Beschaffenheit des Pushes unabhängig.
      # Das Archiv wird vor dem Entpacken gegen die Prüfsumme der Veröffentlichung geprüft. Ein
      # ausgetauschtes Archiv liefe sonst mit Lesezugriff auf die ganze Historie.
      - name: gitleaks installieren
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c

      - name: gitleaks ausführen
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

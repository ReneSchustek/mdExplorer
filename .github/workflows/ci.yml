name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Test & Secret-Scan
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MdExplorer.slnx

      - name: Build (warnings as errors)
        run: dotnet build MdExplorer.slnx -c Release --no-restore -warnaserror

      - name: Test
        # Performance-Tests sind laufzeitabhaengig und auf gemeinsam genutzten Runnern
        # nicht aussagekraeftig — sie laufen lokal, nicht als CI-Gate.
        run: dotnet test MdExplorer.slnx -c Release --no-build --filter "Category!=Performance"

# Der Secret-Scan läuft im Security-Workflow über die offizielle gitleaks-Action —
# dort über die vollständige Historie und zusätzlich nach Zeitplan.

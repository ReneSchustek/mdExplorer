name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Format & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MdExplorer.slnx

      # Die Formatprüfung braucht den Code, den der XAML-Übersetzer erzeugt, und zwar in der
      # Debug-Konfiguration, mit der dotnet format arbeitet. Ohne ihn fehlen die benannten
      # Elemente der Ansichten, und die Analysatoren halten Methoden, die nur auf sie zugreifen,
      # für statisch.
      - name: Build für die Formatprüfung
        run: dotnet build MdExplorer.slnx --no-restore

      - name: Format (no changes allowed)
        run: dotnet format MdExplorer.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build MdExplorer.slnx -c Release --no-restore -warnaserror

      - name: Test
        # Performance-Tests hängen von der Rechenlast ab und sagen auf gemeinsam genutzten
        # Runnern nichts aus; sie laufen deshalb nur lokal, nicht als CI-Gate.
        run: dotnet test MdExplorer.slnx -c Release --no-build --filter "Category!=Performance"

# Der Secret-Scan läuft im Security-Workflow mit dem gitleaks-Programm selbst, dort über
# die vollständige Historie und zusätzlich nach Zeitplan.

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <!-- Stilattribute bleiben erlaubt: Markdig schreibt die Ausrichtung von Tabellenspalten als
         style-Attribut. Ein eingeschleustes <style>-Element dagegen braucht die Nonce. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__NONCE__'; style-src 'nonce-__NONCE__'; style-src-attr 'unsafe-inline'; img-src 'self' data:;" />
    <title>__TITLE__</title>
    <style nonce="__NONCE__">__INLINE_CSS__</style>
</head>
<body data-theme="__THEME__">
    <article id="content">__HELP_HTML__</article>
    <script nonce="__NONCE__">__INLINE_JS__</script>
</body>
</html>
